apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  labels:
    team: appsec
  name: tpt-query-workspace
  namespace: appsec
spec:
  image: "{{ image }}"
  port: 8080
  replicas:
    min: 1
    max: 1
    cpuThresholdPercentage: 90
  resources:
    limits:
      memory: "512Mi"
    requests:
      cpu: "50m"
      memory: "256Mi"
  liveness:
    initialDelay: 30
    path: isalive
  readiness:
    initialDelay: 30
    path: isready
  prometheus:
    enabled: true
    path: /metrics
  env:
    - name: GOOGLE_CLOUD_LOCATION
      value: eu
    - name: VERTEX_MODEL
      value: gemini-3.8-flash
  envFrom:
    - secret: tpt-query-workspace
  gcp:
    sqlInstances:
      - type: POSTGRES_17
        tier: db-f1-micro
        databases:
          - name: query_workspace
            envVarPrefix: DB
  azure:
    application:
      enabled: true
      allowAllUsers: true
    sidecar:
      enabled: true
      autoLogin: true
  accessPolicy:
    outbound:
      rules:
        - application: neo4j
  ingresses:
    - https://tpt-query-workspace.nav.no
