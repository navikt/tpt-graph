name: Build and deploy main
on:
  push:
    branches:
      - main
    paths:
      - 'cmd/tpt-graph/**'
      - 'internal/config/**'
      - 'internal/graphapi/**'
      - 'internal/handler/**'
      - 'internal/neo4j/**'
      - 'internal/telemetry/**'
      - 'internal/whodis/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.nais/nais.yaml'
      - '.github/workflows/main.yaml'
jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: prod-gcp:appsec
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker-push
        with:
          team: appsec
      - uses: nais/deploy/actions/deploy@7ad7c2b833e1db74a80954e3ee6bb6ac060a8ae7 # ratchet:nais/deploy/actions/deploy@v2
        env:
          RESOURCE: .nais/nais.yaml
          CLUSTER: prod-gcp
          IMAGE: ${{ steps.docker-push.outputs.image }}
