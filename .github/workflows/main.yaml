name: Build and deploy main
on:
  push:
    branches:
      - main
    paths:
      - 'cmd/tpt-graph/**'
      - 'internal/config/**'
      - 'internal/graphapi/**'
      - 'internal/handler/**'
      - 'internal/neo4j/**'
      - 'internal/telemetry/**'
      - 'internal/whodis/**'
      - 'go.mod'
      - 'go.sum'
      - 'Dockerfile'
      - '.nais/nais.yaml'
      - '.github/workflows/main.yaml'
jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: prod-gcp:appsec
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/docker-build-push@ceabe305c64640175f133b7e59af6666b0a3c46c # v0
        id: docker-push
        with:
          team: appsec
      - uses: nais/deploy/actions/deploy@6a9dcd6df697ec2d38edc78cadb0b9acd1232f50 # ratchet:nais/deploy/actions/deploy@v3
        env:
          RESOURCE: .nais/nais.yaml
          CLUSTER: prod-gcp
          IMAGE: ${{ steps.docker-push.outputs.image }}
