name: Build and deploy query workspace
on:
  push:
    branches:
      - main
    paths:
      - 'query-workspace/**'
      - '.nais/query-workspace.yaml'
      - '.github/workflows/query-workspace.yaml'
jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: prod-gcp:appsec
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/docker-build-push@dd7421d5068057a020ca46ead966c26190c516b1 # v0
        id: docker-push
        with:
          team: appsec
          image_suffix: -query-workspace
          docker_context: query-workspace
      - uses: nais/deploy/actions/deploy@1064e26587ab2794266a35f477387e561899a7ef # ratchet:nais/deploy/actions/deploy@v2
        env:
          RESOURCE: .nais/query-workspace.yaml
          CLUSTER: prod-gcp
          IMAGE: ${{ steps.docker-push.outputs.image }}
