name: Build and deploy query workspace
on:
  push:
    branches:
      - main
    paths:
      - 'query-workspace/**'
      - '.nais/query-workspace.yaml'
      - '.github/workflows/query-workspace.yaml'
jobs:
  build:
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-latest
    environment: prod-gcp:appsec
    steps:
      - uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false
      - uses: nais/docker-build-push@d3a1f7e259ecc381a50435e1d4add9059429ebd7 # v0
        id: docker-push
        with:
          team: appsec
          image_suffix: -query-workspace
          docker_context: query-workspace
      - uses: nais/deploy/actions/deploy@7b60caaded00332e9aa117a8342daa0876851dfe # ratchet:nais/deploy/actions/deploy@v2
        env:
          RESOURCE: .nais/query-workspace.yaml
          CLUSTER: prod-gcp
          IMAGE: ${{ steps.docker-push.outputs.image }}
