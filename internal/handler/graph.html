{{define "content"}}
<style>
  /* Override main max-width for the graph page */
  main { max-width: 100% !important; padding: 0 1.5rem; }

  .graph-toolbar {
    display: flex;
    align-items: center;
    gap: 0.75rem;
    padding: 1rem 0 0.75rem;
    flex-wrap: wrap;
  }
  .graph-toolbar h2 { margin: 0; }
  .graph-toolbar form { margin: 0; }
  .graph-hint {
    font-size: 0.78rem;
    color: #888;
    padding-bottom: 0.75rem;
  }
  #graph-error { display: none; margin-bottom: 0.75rem; }

  .graph-wrap {
    display: flex;
    height: calc(100vh - 56px - 120px);
    min-height: 600px;
    border-radius: 9px;
    overflow: hidden;
    border: 1.5px solid #2a2a4a;
  }

  #cy {
    flex: 1;
    background: #f0f2f5;
  }

  #sidebar {
    width: 320px;
    flex-shrink: 0;
    background: #fff;
    border-left: 1.5px solid #dde1e7;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
  }
  #sidebar-empty {
    flex: 1;
    display: flex;
    align-items: center;
    justify-content: center;
    color: #aaa;
    font-size: 0.82rem;
    padding: 1.5rem;
    text-align: center;
    line-height: 1.6;
  }
  #sidebar-content { display: none; padding: 1.25rem; }
  #sidebar-label {
    font-size: 0.68rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.08em;
    color: #888;
    margin-bottom: 0.2rem;
  }
  #sidebar-caption {
    font-size: 1rem;
    font-weight: 700;
    margin-bottom: 1.25rem;
    word-break: break-all;
    color: #1a1a2e;
    line-height: 1.3;
  }
  .prop-row {
    display: grid;
    grid-template-columns: minmax(80px, auto) 1fr;
    gap: 0.2rem 0.75rem;
    align-items: baseline;
    padding: 0.3rem 0;
    border-bottom: 1px solid #f0f2f5;
    font-size: 0.78rem;
  }
  .prop-row:last-child { border-bottom: none; }
  .prop-key { font-weight: 600; color: #666; white-space: nowrap; }
  .prop-val { color: #1a1a2e; word-break: break-all; }
  .prop-val.null-val { color: #bbb; font-style: italic; }
</style>

<div class="graph-toolbar">
  <h2 style="white-space:nowrap;">Graph explorer</h2>
  <form id="graph-form">
    <input type="text" id="repo-input" name="repo" placeholder="tpt-graph" autocomplete="off" spellcheck="false" style="min-width:220px;" />
    <button type="submit">Explore</button>
  </form>
</div>
<p class="graph-hint">Click a node to inspect it. Dashed border = unexplored neighbours, click to expand. Summary nodes (grey, dashed) represent grouped neighbours — click to reveal. Double-click an expanded node to collapse it.</p>
<div id="graph-error" class="card card-error"></div>

<div class="graph-wrap">
  <div id="cy"></div>
  <div id="sidebar">
    <div id="sidebar-empty">Select a node<br>to inspect its properties</div>
    <div id="sidebar-content">
      <div id="sidebar-label"></div>
      <div id="sidebar-caption"></div>
      <div id="sidebar-props"></div>
    </div>
  </div>
</div>

<script src="/static/layout-base.min.js"></script>
<script src="/static/cose-base.min.js"></script>
<script src="/static/cytoscape.min.js"></script>
<script src="/static/cytoscape-fcose.min.js"></script>
<script>
(function () {
  'use strict';

  // ── Cytoscape instance ──────────────────────────────────────────────────────
  const cy = cytoscape({
    container: document.getElementById('cy'),
    style: [
      {
        selector: 'node',
        style: {
          'label':              'data(label)',
          'background-color':   'data(color)',
          'color':              '#fff',
          'text-valign':        'center',
          'text-halign':        'center',
          'font-size':          '10px',
          'font-weight':        'bold',
          'font-family':        'system-ui, sans-serif',
          'text-wrap':          'wrap',
          'text-max-width':     '80px',
          'width':              80,
          'height':             80,
          'border-width':       0,
          'border-color':       '#333',
          'text-outline-width': 2,
          'text-outline-color': 'data(color)',
        }
      },
      {
        selector: 'node[?hasMore]',
        style: {
          'border-width': 3,
          'border-style': 'dashed',
          'border-color': '#333',
        }
      },
      {
        selector: 'node.expanded',
        style: {
          'border-style': 'solid',
          'border-width':  2,
          'border-color':  'rgba(0,0,0,0.25)',
        }
      },
      {
        selector: 'node[?isSummary]',
        style: {
          'label':              'data(caption)',
          'background-color':   '#7a7a9a',
          'border-width':        3,
          'border-style':       'dashed',
          'border-color':       '#444',
          'font-size':          '10px',
          'text-max-width':     '70px',
          'width':               60,
          'height':              60,
          'text-outline-color': '#7a7a9a',
        }
      },
      {
        selector: 'node:selected',
        style: {
          'border-width':  4,
          'border-style':  'solid',
          'border-color':  '#333',
          'width':         96,
          'height':        96,
        }
      },
      {
        selector: 'edge',
        style: {
          'label':                    'data(type)',
          'font-size':                '9px',
          'color':                    '#1a1a2e',
          'font-family':              'system-ui, sans-serif',
          'curve-style':              'bezier',
          'control-point-step-size':  40,
          'target-arrow-shape':       'triangle',
          'target-arrow-color':       '#1a1a2e',
          'line-color':               '#1a1a2e',
          'text-background-color':    '#f0f2f5',
          'text-background-opacity':  1,
          'text-background-padding':  '3px',
          'width':                    1.5,
        }
      }
    ],
    layout: { name: 'grid' },
    userZoomingEnabled:  true,
    userPanningEnabled:  true,
    minZoom: 0.1,
    maxZoom: 4,
  });

  // ── State ───────────────────────────────────────────────────────────────────
  const expandedNodes = new Set();       // node IDs that have been expanded
  const childrenOf    = new Map();       // nodeId → Set of element IDs added by that expand
  let expanding = false;                 // prevent concurrent expands

  // ── Tap handler — sidebar and summary-group expand ──────────────────────────
  cy.on('tap', 'node', function (evt) {
    const node = evt.target;
    const data = node.data();

    // Summary node: expand it into real nodes immediately (no server call).
    if (data.isSummary) {
      expandSummary(node);
      return;
    }

    // Update sidebar for real nodes.
    showSidebar(data);
  });

  // ── Double-tap handler — expand or collapse a real node ─────────────────────
  cy.on('dbltap', 'node', async function (evt) {
    const node = evt.target;
    const data = node.data();

    // Summary nodes are handled by single-tap; ignore here.
    if (data.isSummary) return;

    // ── Collapse if already expanded ─────────────────────────────────────────
    if (expandedNodes.has(data.id)) {
      const id         = data.id;
      const introduced = childrenOf.get(id) || new Set();

      // Collect nodes to remove: those introduced by this expand that have no
      // connections to nodes outside the introduced set (other than back to the
      // collapsed node itself).
      const toRemove = cy.collection();
      introduced.forEach(eid => {
        const el = cy.getElementById(eid);
        if (el.length === 0 || el.isEdge()) return;

        const hasExternalConnection = el.connectedEdges().some(edge => {
          const other = edge.source().data('id') === eid
            ? edge.target().data('id')
            : edge.source().data('id');
          return other !== id && !introduced.has(other);
        });

        if (!hasExternalConnection) toRemove.merge(el);
      });

      // Remove the orphaned nodes — their edges are removed automatically.
      toRemove.remove();

      // Also remove any introduced edges that are now dangling.
      introduced.forEach(eid => {
        const el = cy.getElementById(eid);
        if (el.length > 0 && el.isEdge()) el.remove();
      });

      // Reset state so the node can be re-expanded.
      expandedNodes.delete(id);
      childrenOf.delete(id);
      node.removeClass('expanded');
      node.data('hasMore', true);
      return;
    }

    // ── Expand if eligible ────────────────────────────────────────────────────
    if (!data.hasMore || expanding) return;

    expanding = true;
    expandedNodes.add(data.id);
    node.addClass('expanded');

    try {
      // Exclude summary node IDs from knownIds — they are virtual and unknown to the server.
      const knownIds = cy.nodes()
        .filter(n => !n.data('isSummary'))
        .map(n => n.data('id')).join(',');
      const url = `/api/graph/expand?id=${encodeURIComponent(data.id)}&known=${encodeURIComponent(knownIds)}`;
      const res = await fetch(url);
      if (!res.ok) { expanding = false; return; }

      const payload = await res.json();
      const elements = payloadToElements(payload);
      if (elements.length === 0) { expanding = false; return; }

      // Build summary elements: groups with >1 node become a single summary node.
      // Groups with exactly 1 node are shown directly.
      const { summaryElements, directElements } =
        buildSummaryElements(elements, data.id);

      const allElements = [...summaryElements, ...directElements];
      if (allElements.length === 0) { expanding = false; return; }

      // Track all introduced element IDs for collapse.
      const newNodeIds = new Set(allElements.filter(e => e.group === 'nodes').map(e => e.data.id));
      const newEdgeIds = new Set(allElements.filter(e => e.group === 'edges').map(e => e.data.id));
      childrenOf.set(data.id, new Set([...newNodeIds, ...newEdgeIds]));

      const existingBB = cy.nodes().boundingBox();
      const hubPos     = node.position();
      const numGroups  = countGroups(allElements, data.id);
      const freeArc    = findFreeArc(hubPos, numGroups);

      if (freeArc !== null) {
        seedPositionsByRelationship(allElements, data.id, hubPos, existingBB, freeArc);
        cy.add(allElements);
        cy.animate({ fit: { eles: cy.elements(), padding: 60 } }, { duration: 500 });
      } else {
        seedPositionsByRelationship(allElements, data.id, hubPos, existingBB, null);
        cy.add(allElements);
        cy.layout({
          name:                        'fcose',
          animate:                     true,
          animationDuration:           900,
          fit:                         true,
          padding:                     60,
          randomize:                   false,
          quality:                     'proof',
          nodeDimensionsIncludeLabels: true,
          uniformNodeDimensions:       false,
          nodeRepulsion:               45000,
          idealEdgeLength:             200,
          edgeElasticity:              0.45,
          nestingFactor:               0.1,
          gravity:                     0.15,
          gravityRange:                3.8,
          numIter:                     5000,
          tile:                        true,
          tilingPaddingVertical:       30,
          tilingPaddingHorizontal:     30,
        }).run();
      }
    } catch (e) {
      console.error('expand failed', e);
    } finally {
      expanding = false;
    }
  });

  // ── Form submit ─────────────────────────────────────────────────────────────
  document.getElementById('graph-form').addEventListener('submit', async function (e) {
    e.preventDefault();
    const repo = document.getElementById('repo-input').value.trim();
    if (!repo) return;

    const errEl = document.getElementById('graph-error');
    errEl.style.display = 'none';
    cy.elements().remove();
    expandedNodes.clear();
    childrenOf.clear();
    hideSidebar();

    try {
      const res = await fetch(`/api/graph/seed?repo=${encodeURIComponent(repo)}`);
      if (res.status === 404) {
        errEl.textContent = `No repository found with name "${repo}".`;
        errEl.style.display = 'block';
        return;
      }
      if (!res.ok) {
        errEl.textContent = 'Graph query failed — please try again.';
        errEl.style.display = 'block';
        return;
      }

      const payload = await res.json();
      cy.add(payloadToElements(payload));
      cy.layout({
        name:             'breadthfirst',
        animate:          true,
        animationDuration: 600,
        directed:         true,
        fit:              true,
        padding:          60,
        spacingFactor:    1.75,
      }).run();

    } catch (e) {
      errEl.textContent = 'Unexpected error — see console for details.';
      errEl.style.display = 'block';
      console.error(e);
    }
  });

  // ── Sidebar helpers ─────────────────────────────────────────────────────────
  function showSidebar(data) {
    document.getElementById('sidebar-empty').style.display   = 'none';
    document.getElementById('sidebar-content').style.display = 'block';
    document.getElementById('sidebar-label').textContent     = (data.labels || []).join(' · ');
    document.getElementById('sidebar-caption').textContent   = data.caption || data.id;

    const container = document.getElementById('sidebar-props');
    container.innerHTML = '';
    const props = data.properties || {};
    Object.entries(props)
      .filter(([, v]) => v !== null && v !== undefined && v !== '')
      .sort(([a], [b]) => a.localeCompare(b))
      .forEach(([k, v]) => {
        const row = document.createElement('div');
        row.className = 'prop-row';

        const key = document.createElement('span');
        key.className = 'prop-key';
        key.textContent = k;

        const val = document.createElement('span');
        val.className = 'prop-val';
        val.textContent = Array.isArray(v) ? (v.join(', ') || '(empty)') : String(v);

        row.appendChild(key);
        row.appendChild(val);
        container.appendChild(row);
      });
  }

  function hideSidebar() {
    document.getElementById('sidebar-empty').style.display   = 'flex';
    document.getElementById('sidebar-content').style.display = 'none';
  }

  // ── Graph payload → Cytoscape elements ─────────────────────────────────────
  function payloadToElements(payload) {
    const elements = [];
    const addedIds = new Set();

    (payload.nodes || []).forEach(n => {
      if (cy.getElementById(n.id).length > 0) return;
      addedIds.add(n.id);
      elements.push({
        group: 'nodes',
        data:  {
          id:         n.id,
          caption:    n.caption,
          nodeType:   n.nodeType,
          label:      n.caption + '\n' + n.nodeType,
          color:      n.color,
          hasMore:    n.hasMore,
          labels:     n.labels,
          properties: n.properties,
        }
      });
    });
    (payload.edges || []).forEach(e => {
      if (cy.getElementById(e.id).length > 0) return;
      // Include edge if both endpoints are either already in the graph
      // or being added in this same batch.
      const srcOk = cy.getElementById(e.source).length > 0 || addedIds.has(e.source);
      const tgtOk = cy.getElementById(e.target).length > 0 || addedIds.has(e.target);
      if (!srcOk || !tgtOk) return;
      elements.push({
        group: 'edges',
        data:  { id: e.id, source: e.source, target: e.target, type: e.type }
      });
    });
    return elements;
  }

  // ── Build summary elements ──────────────────────────────────────────────────
  // Groups new elements by relationship type. Groups with >1 node become a
  // single summary node. Groups with exactly 1 node are passed through directly.
  // Returns { summaryElements, directElements }.
  function buildSummaryElements(elements, hubId) {
    const nodeEls = elements.filter(e => e.group === 'nodes');
    const edgeEls = elements.filter(e => e.group === 'edges');

    // Map each new node to its relationship type from the hub.
    const nodeRelType = new Map();
    edgeEls.forEach(e => {
      const d = e.data;
      if (d.source === hubId && !nodeRelType.has(d.target)) nodeRelType.set(d.target, d.type);
      else if (d.target === hubId && !nodeRelType.has(d.source)) nodeRelType.set(d.source, d.type);
    });

    // Group nodes by relationship type.
    const groups = {};
    nodeEls.forEach(el => {
      const key = nodeRelType.get(el.data.id) || primaryLabel(el.data.labels || []);
      if (!groups[key]) groups[key] = { nodes: [], edges: [] };
      groups[key].nodes.push(el);
    });
    // Attach edges to their group.
    edgeEls.forEach(e => {
      const d = e.data;
      const peerId = d.source === hubId ? d.target : d.source;
      const key = nodeRelType.get(peerId);
      if (key && groups[key]) groups[key].edges.push(e);
    });

    const summaryElements = [];
    const directElements  = [];

    Object.entries(groups).forEach(([relType, { nodes, edges }]) => {
      if (nodes.length === 1) {
        // Single node — show directly.
        directElements.push(nodes[0]);
        directElements.push(...edges);
        return;
      }

      // Multiple nodes — create a summary node and a single edge to the hub.
      const summaryId = `__summary__${hubId}__${relType}`;
      summaryElements.push({
        group: 'nodes',
        data: {
          id:             summaryId,
          caption:        `${nodes.length} × ${relType}`,
          color:          '#7a7a9a',
          hasMore:        true,
          isSummary:      true,
          labels:         [],
          properties:     {},
          // Store the real nodes and edges so we can expand later without a server call.
          summaryNodes:   nodes,
          summaryEdges:   edges,
          summaryHubId:   hubId,
        }
      });
      summaryElements.push({
        group: 'edges',
        data: {
          id:     `__summary_edge__${hubId}__${relType}`,
          source: hubId,
          target: summaryId,
          type:   relType,
        }
      });
    });

    return { summaryElements, directElements };
  }

  // ── Expand a summary node into its real nodes ───────────────────────────────
  function expandSummary(summaryNode) {
    const data      = summaryNode.data();
    const realNodes = data.summaryNodes || [];
    const realEdges = data.summaryEdges || [];
    if (realNodes.length === 0) return;

    const summaryPos = summaryNode.position();
    const hubId      = data.summaryHubId;

    // Remove the summary node (its edge is removed automatically).
    const summaryId = data.id;
    summaryNode.remove();

    // Remove summary from parent's childrenOf so collapse still works.
    for (const [parentId, children] of childrenOf.entries()) {
      if (children.has(summaryId)) {
        children.delete(summaryId);
        // Add real node/edge IDs in their place.
        realNodes.forEach(n => children.add(n.data.id));
        realEdges.forEach(e => children.add(e.data.id));
        // Also remove the summary edge ID.
        children.delete(`__summary_edge__${hubId}__${data.caption.split(' × ')[1]}`);
      }
    }

    // Place real nodes clustered around the summary node's former position.
    const spread = 100;
    realNodes.forEach((el, i) => {
      const cols = Math.ceil(Math.sqrt(realNodes.length));
      const col  = i % cols;
      const row  = Math.floor(i / cols);
      el.position = {
        x: summaryPos.x + (col - (cols - 1) / 2) * spread,
        y: summaryPos.y + (row - (Math.ceil(realNodes.length / cols) - 1) / 2) * spread,
      };
    });

    cy.add([...realNodes, ...realEdges]);
    cy.animate({ fit: { eles: cy.elements(), padding: 60 } }, { duration: 400 });
  }

  // ── Count distinct relationship groups in a payload ────────────────────────
  function countGroups(elements, hubId) {
    const edgeEls   = elements.filter(e => e.group === 'edges');
    const nodeRelType = new Map();
    edgeEls.forEach(e => {
      const d = e.data;
      if (d.source === hubId && !nodeRelType.has(d.target)) nodeRelType.set(d.target, d.type);
      else if (d.target === hubId && !nodeRelType.has(d.source)) nodeRelType.set(d.source, d.type);
    });
    const keys = new Set();
    elements.filter(e => e.group === 'nodes').forEach(el => {
      keys.add(nodeRelType.get(el.data.id) || primaryLabel(el.data.labels || []));
    });
    return keys.size || 1;
  }

  // ── Find a free angular arc around the hub ──────────────────────────────────
  // Returns { startAngle, totalArc } in radians if enough free space exists,
  // or null if existing nodes occupy too much of the circle.
  // "Free" means no existing node (other than the hub) falls within the arc
  // when viewed from the hub, with a 25° buffer on each occupied angle.
  function findFreeArc(hubPos, numGroups) {
    const BUFFER_RAD  = (25 * Math.PI) / 180; // 25° buffer around each existing node
    const MIN_ARC_RAD = (40 * Math.PI) / 180; // minimum arc per group

    const required = numGroups * MIN_ARC_RAD;

    // Collect angles of all existing nodes relative to the hub.
    const occupied = [];
    cy.nodes().forEach(n => {
      const pos = n.position();
      const dx  = pos.x - hubPos.x;
      const dy  = pos.y - hubPos.y;
      if (Math.abs(dx) < 1 && Math.abs(dy) < 1) return; // skip hub itself
      occupied.push(Math.atan2(dy, dx));
    });

    if (occupied.length === 0) {
      return { startAngle: -Math.PI / 2, totalArc: 2 * Math.PI };
    }

    // Sort occupied angles and find the largest contiguous free arc.
    occupied.sort((a, b) => a - b);

    // Build blocked intervals [angle - buffer, angle + buffer] on the circle.
    // Find gaps between consecutive blocked intervals.
    const TWO_PI = 2 * Math.PI;
    let bestStart = 0;
    let bestArc   = 0;

    for (let i = 0; i < occupied.length; i++) {
      const gapStart = occupied[i] + BUFFER_RAD;
      const gapEnd   = occupied[(i + 1) % occupied.length] - BUFFER_RAD
        + (i + 1 === occupied.length ? TWO_PI : 0);
      const arc = gapEnd - gapStart;
      if (arc > bestArc) {
        bestArc   = arc;
        bestStart = gapStart;
      }
    }

    if (bestArc < required) return null; // not enough room — trigger re-render
    return { startAngle: bestStart, totalArc: bestArc };
  }

  // ── Seed positions for new nodes by relationship type ───────────────────────
  // Places each relationship group in its own sector within the free arc.
  // When freeArc is null (full re-render path) positions are still seeded
  // so fcose starts from a grouped state.
  function seedPositionsByRelationship(elements, hubId, origin, existingBB, freeArc) {
    const nodeEls = elements.filter(e => e.group === 'nodes');
    const edgeEls = elements.filter(e => e.group === 'edges');
    if (nodeEls.length === 0) return;

    // Map each new node to the relationship type of its direct edge to the hub.
    const nodeRelType = new Map();
    edgeEls.forEach(e => {
      const d = e.data;
      if (d.source === hubId && !nodeRelType.has(d.target)) nodeRelType.set(d.target, d.type);
      else if (d.target === hubId && !nodeRelType.has(d.source)) nodeRelType.set(d.source, d.type);
    });

    // Group by relationship type, fall back to primary label.
    const groups = {};
    nodeEls.forEach(el => {
      const key = nodeRelType.get(el.data.id) || primaryLabel(el.data.labels || []);
      if (!groups[key]) groups[key] = [];
      groups[key].push(el);
    });

    const groupList  = Object.values(groups);
    const numGroups  = groupList.length;
    const halfDiag   = Math.sqrt(existingBB.w ** 2 + existingBB.h ** 2) / 2;
    const ringRadius = halfDiag + 350;
    const innerSpread = 100;
    const graphCx    = existingBB.x1 + existingBB.w / 2;
    const graphCy    = existingBB.y1 + existingBB.h / 2;

    groupList.forEach((nodes, groupIdx) => {
      let angle;
      if (freeArc !== null) {
        // Distribute groups evenly within the free arc.
        const step = freeArc.totalArc / (numGroups + 1);
        angle = freeArc.startAngle + step * (groupIdx + 1);
      } else {
        // Full re-render fallback: spread evenly around the full circle.
        angle = (2 * Math.PI * groupIdx) / numGroups - Math.PI / 2;
      }

      const cx = graphCx + ringRadius * Math.cos(angle);
      const cy = graphCy + ringRadius * Math.sin(angle);

      nodes.forEach((el, i) => {
        const cols = Math.ceil(Math.sqrt(nodes.length));
        const col  = i % cols;
        const row  = Math.floor(i / cols);
        const ox   = (col - (cols - 1) / 2) * innerSpread;
        const oy   = (row - (Math.ceil(nodes.length / cols) - 1) / 2) * innerSpread;
        el.position = { x: cx + ox, y: cy + oy };
      });
    });
  }

  // Returns the most specific application-level label from a list,
  // mirroring the priority list in graphapi.go.
  function primaryLabel(labels) {
    const priority = [
      'GitHubRepository','GitHubUser','GitHubTeam','GitHubActionsSecret',
      'GitHubActionsVariable','GitHubWorkflow','GitHubEnvironment',
      'GitHubDependabotAlert','GitHubPersonalAccessToken',
      'NaisApp','NaisTeam','NaisMember','NaisDeployment','NaisTenant',
      'KubernetesNamespace','KubernetesIngress','KubernetesPod',
      'KubernetesContainer','KubernetesSecret','KubernetesServiceAccount',
      'KubernetesCluster','KubernetesNode','KubernetesService',
      'KubernetesRole','KubernetesClusterRole',
      'KubernetesRoleBinding','KubernetesClusterRoleBinding',
    ];
    const set = new Set(labels);
    for (const p of priority) { if (set.has(p)) return p; }
    return labels[0] || 'Unknown';
  }

})();
