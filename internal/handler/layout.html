{{define "layout"}}<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TittPåGraphDataTing</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background: #f0f2f5;
      min-height: 100vh;
      color: #1a1a2e;
    }

    header {
      background: #fff;
      border-bottom: 1px solid #e4e7ec;
      padding: 0 2rem;
      display: flex;
      align-items: center;
      gap: 2.5rem;
      height: 56px;
    }

    .logo {
      font-size: 1rem;
      font-weight: 700;
      white-space: nowrap;
      text-decoration: none;
      color: #1a1a2e;
    }

    nav {
      display: flex;
      gap: 0.25rem;
    }

    nav a {
      padding: 0.4rem 0.9rem;
      border-radius: 6px;
      font-size: 0.88rem;
      font-weight: 500;
      text-decoration: none;
      color: #555;
      transition: background 0.15s, color 0.15s;
    }
    nav a:hover  { background: #f0f2f5; color: #1a1a2e; }
    nav a.active { background: #e8f0fb; color: #0067c5; font-weight: 600; }

    main {
      max-width: 700px;
      margin: 3rem auto;
      padding: 0 1.5rem;
    }

    main.wide {
      max-width: 1200px;
    }

    h2 {
      font-size: 1.25rem;
      font-weight: 700;
      margin-bottom: 1.5rem;
    }

    form {
      display: flex;
      gap: 0.5rem;
      flex-wrap: wrap;
      margin-bottom: 2rem;
    }

    input[type="text"] {
      flex: 1;
      min-width: 140px;
      padding: 0.6rem 0.85rem;
      border: 1.5px solid #ccc;
      border-radius: 7px;
      font-size: 0.92rem;
      background: #fff;
      outline: none;
      transition: border-color 0.15s;
      font-family: "SF Mono", "Consolas", "Menlo", monospace;
    }
    input[type="text"]:focus { border-color: #0067c5; }

    button {
      padding: 0.6rem 1.2rem;
      background: #0067c5;
      color: #fff;
      border: none;
      border-radius: 7px;
      font-size: 0.92rem;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.15s;
      white-space: nowrap;
    }
    button:hover { background: #0057a8; }

    .results { display: flex; flex-direction: column; gap: 1rem; }

    .card {
      padding: 1rem 1.25rem;
      border-radius: 9px;
      font-size: 0.92rem;
      line-height: 1.5;
    }
    .card-found   { background: #eaf6ee; border: 1.5px solid #86c99a; color: #1b4d2e; }
    .card-missing { background: #fffbea; border: 1.5px solid #f0c040; color: #5a4000; }
    .card-error   { background: #fdf0f0; border: 1.5px solid #e8a0a0; color: #6b1a1a; }
    .card-info    { background: #fff;    border: 1.5px solid #dde1e7; color: #1a1a2e; }
    .card-warn    { background: #fffbea; border: 1.5px solid #f0c040; color: #5a4000; }

    .card-label {
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      opacity: 0.55;
      margin-bottom: 0.25rem;
    }
    .card-value {
      font-size: 1.1rem;
      font-weight: 700;
      font-family: "SF Mono", "Consolas", "Menlo", monospace;
    }

    .team-header { display: flex; align-items: baseline; gap: 0.75rem; margin-bottom: 1rem; }
    .team-name   { font-size: 1rem; font-weight: 700; }
    .team-slack  { font-size: 0.85rem; color: #0067c5; font-family: "SF Mono", "Consolas", "Menlo", monospace; }

    table { width: 100%; border-collapse: collapse; font-size: 0.875rem; }
    th {
      text-align: left;
      font-size: 0.7rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      opacity: 0.55;
      padding: 0 0.75rem 0.4rem 0;
      border-bottom: 1.5px solid #dde1e7;
      white-space: nowrap;
    }
    td { padding: 0.4rem 0.75rem 0.4rem 0; border-bottom: 1px solid #eef0f3; vertical-align: middle; white-space: nowrap; }
    tr:last-child td { border-bottom: none; }

    .table-scroll { overflow-x: auto; -webkit-overflow-scrolling: touch; }
    td.wrap { white-space: normal; }

    .mono        { font-family: "SF Mono", "Consolas", "Menlo", monospace; font-size: 0.8rem; color: #444; }
    .role-owner  { font-weight: 700; font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: #0057a8; }
    .role-member { font-size: 0.72rem; text-transform: uppercase; letter-spacing: 0.05em; color: #888; }
    .result-meta { font-size: 0.78rem; color: #888; margin-bottom: 0.75rem; }

    .page-desc {
      font-size: 0.88rem;
      color: #666;
      line-height: 1.6;
      margin-bottom: 1.5rem;
      max-width: 560px;
    }

    .examples {
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-bottom: 2rem;
    }
    .examples-label {
      font-size: 0.72rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.07em;
      opacity: 0.45;
      margin-right: 0.25rem;
    }
    .example-link {
      font-size: 0.8rem;
      font-family: "SF Mono", "Consolas", "Menlo", monospace;
      color: #0067c5;
      text-decoration: none;
      background: #e8f0fb;
      padding: 0.2rem 0.6rem;
      border-radius: 5px;
      transition: background 0.15s;
    }
    .example-link:hover { background: #d0e3f7; }
  </style>
</head>
<body>
  <header>
    <a class="logo" href="/">TittPåGraphDataTing</a>
    <nav>
      <a href="/search"     {{if eq .ActiveTab "search"}}class="active"{{end}}>Ingress ownership</a>
      <a href="/dependency" {{if eq .ActiveTab "dependency"}}class="active"{{end}}>Dependency usage</a>
      <a href="/graph"      {{if eq .ActiveTab "graph"}}class="active"{{end}}>Graph explorer</a>
    </nav>
  </header>
  <main {{if eq .ActiveTab "dependency"}}class="wide"{{end}}>
    {{template "content" .}}
  </main>
</body>
</html>{{end}}
